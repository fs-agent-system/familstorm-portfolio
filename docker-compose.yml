name: ${STACK:-familstorm-portfolio}

x-logging: &logging
  logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-ghcr.io/fs-agent-system/familstorm-portfolio:${IMAGE_TAG:-latest}}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
    mem_limit: 256m
    <<: *logging
