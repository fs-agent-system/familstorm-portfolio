# .github/workflows/deploy-production.yml — build image -> GHCR -> deploy production on VPS (v2).
# Trigger: push to `master` (Manager-gated release only per HERMES-05 §5).
# Stack: <slug>-production on hermes-vps runner with port 8241 (registry.tsv).
name: deploy-production

"on":
  push:
    branches: [master]

concurrency:
  group: prod-${{ github.repository }}

permissions:
  contents: read
  packages: write

env:
  OWNER: ${{ github.repository_owner }}
  REPO: ${{ github.event.repository.name }}
  IMG: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMG }}:latest
            ${{ env.IMG }}:prod
            ${{ env.IMG }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, hermes-vps]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve slug + prod ports from registry
        id: reg
        run: |
          REGF=/opt/deploys/registry.tsv
          row=$(grep -vE '^#' "$REGF" | awk -v r="${OWNER}/${REPO}" '$2==r {print; exit}')
          [ -n "$row" ] || { echo "repo ${OWNER}/${REPO} missing from $REGF"; exit 1; }
          echo "slug=$(echo "$row" | cut -f1)"   >> "$GITHUB_OUTPUT"
          echo "fport=$(echo "$row" | cut -f6)"  >> "$GITHUB_OUTPUT"
          echo "domain=$(echo "$row" | cut -f8)" >> "$GITHUB_OUTPUT"

      - name: Pull and up production stack
        env:
          SLUG: ${{ steps.reg.outputs.slug }}
          FRONTEND_PORT_PROD: ${{ steps.reg.outputs.fport }}
          IMAGE_NAME: ${{ env.IMG }}:sha-${{ github.sha }}
          IMAGE_TAG: sha-${{ github.sha }}
          STACK: ${{ steps.reg.outputs.slug }}-production
        run: |
          mkdir -p /opt/deploys/${SLUG}-production
          cd /opt/deploys/${SLUG}-production
          cp "$GITHUB_WORKSPACE"/docker-compose*.yml .
          docker compose -f docker-compose.yml -f docker-compose.production.yml -p "${STACK}" pull
          docker compose -f docker-compose.yml -f docker-compose.production.yml -p "${STACK}" up -d --remove-orphans
          docker image prune -f

      - name: Healthcheck production web service
        env:
          FRONTEND_PORT_PROD: ${{ steps.reg.outputs.fport }}
          STACK: ${{ steps.reg.outputs.slug }}-production
        run: |
          echo "Verifying production endpoint responsiveness at http://127.0.0.1:${FRONTEND_PORT_PROD}/ ..."
          HEALTHY=0
          for i in $(seq 1 30); do
            if curl -fsS -m 3 "http://127.0.0.1:${FRONTEND_PORT_PROD}/" >/dev/null 2>&1; then
              echo "Production web service responded HTTP 200 OK (attempt $i)"
              HEALTHY=1
              break
            fi
            sleep 3
          done
          if [ "$HEALTHY" -ne 1 ]; then
            echo "::error::Production healthcheck failed after 30 attempts on port ${FRONTEND_PORT_PROD}"
            docker compose -f docker-compose.yml -f docker-compose.production.yml -p "${STACK}" logs --tail 50 web || true
            exit 1
          fi

          # Verify Docker container health status
          CID=$(docker ps -q --filter "label=com.docker.compose.project=${STACK}" --filter "label=com.docker.compose.service=web" | head -n1)
          if [ -n "$CID" ]; then
            status=$(docker inspect --format='{{.State.Health.Status}}' "$CID" 2>/dev/null || echo "unknown")
            echo "Container ${CID:0:12} health status: $status"
            if [ "$status" = "unhealthy" ]; then
              echo "::error::Container reported unhealthy status"
              docker logs --tail 50 "$CID" || true
              exit 1
            fi
          fi
